<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>我的打卡</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;padding-bottom:78px}button,input{font:inherit}button{border:0}.top{background:#111827;color:#fff;padding:20px 18px 18px;border-radius:0 0 22px 22px}.title{font-size:22px;font-weight:800}.sub{opacity:.72;font-size:13px;margin-top:5px}.clock{font-size:40px;font-weight:800;letter-spacing:1px;margin-top:18px}.card{background:#fff;margin:14px;border-radius:18px;padding:18px;box-shadow:0 4px 18px #0000000b}.status{font-weight:700;font-size:17px}.date{color:#777;margin-top:5px}.row{display:flex;gap:10px;margin-top:16px}.punch{flex:1;padding:15px;border-radius:13px;font-weight:800;background:#111827;color:#fff}.punch:disabled{opacity:.35}.secondary{background:#eceef2;color:#222}.section-title{font-size:18px;font-weight:800;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow{text-align:center;color:#888;font-size:12px;padding:5px}.day{min-height:46px;border-radius:10px;background:#f1f2f4;padding:6px;font-size:13px;text-align:left}.day b{display:block}.day.has{background:#e9eef7}.day.today{outline:2px solid #111827}.day small{color:#666}.list{display:flex;flex-direction:column;gap:9px}.record{background:#fff;border-radius:15px;padding:14px;box-shadow:0 2px 12px #00000009}.record-head{display:flex;justify-content:space-between;font-weight:800}.record-info{color:#666;font-size:14px;margin-top:7px;line-height:1.7}.edit{margin-top:9px;width:100%;padding:10px;border-radius:10px;background:#f0f1f3;font-weight:700}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(4,1fr);padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:20}.nav button{background:none;color:#777;font-size:12px;padding:7px 2px}.nav button.active{color:#111827;font-weight:800}.page{display:none}.page.active{display:block}.monthbar{display:flex;gap:8px;align-items:center}.monthbar input{flex:1;padding:11px;border:1px solid #ddd;border-radius:10px;background:#fff}.arrow{width:42px;height:42px;border-radius:10px;background:#fff;border:1px solid #ddd}.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat .box{background:#f5f6f8;border-radius:13px;padding:13px}.num{font-size:20px;font-weight:800;margin-top:5px}.setting{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #eee}.setting input{width:110px;padding:8px;border:1px solid #ddd;border-radius:9px;text-align:right}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:50}.modal.hidden{display:none}.sheet{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:20px 18px 30px;max-height:90vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center;font-size:19px;font-weight:800}.close{width:44px;height:44px;border-radius:50%;background:#eee;font-size:28px}.field{margin-top:14px}.field label{display:block;color:#666;font-size:13px;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #ddd;border-radius:11px}.save{width:100%;margin-top:18px}.hint{font-size:12px;color:#888;margin-top:10px;line-height:1.6}.danger{background:#fff0f0;color:#a00}.empty{text-align:center;color:#888;padding:30px 10px}
</style>
</head>
<body>
<div id="home" class="page active">
  <div class="top"><div class="title">我的打卡</div><div class="sub">簡單記錄每天上下班</div><div id="clock" class="clock">--:--:--</div></div>
  <div class="card"><div id="status" class="status">今天尚未上班打卡</div><div id="today" class="date"></div><div class="row"><button id="inBtn" class="punch">上班打卡</button><button id="outBtn" class="punch secondary">下班打卡</button></div></div>
  <div class="card"><div class="section-title">今日紀錄</div><div id="todayInfo" class="record-info">尚無紀錄</div></div>
</div>
<div id="records" class="page"><div class="card"><div class="section-title">打卡紀錄</div><div id="recordList" class="list"></div></div></div>
<div id="month" class="page"><div class="card"><div class="section-title">月統計</div><div class="monthbar"><button class="arrow" id="prev">‹</button><input id="monthPick" type="month"><button class="arrow" id="next">›</button></div><div class="stat" style="margin-top:14px"><div class="box">出勤天數<div id="days" class="num">0 天</div></div><div class="box">加班分鐘<div id="otMin" class="num">0 分</div></div><div class="box">正常薪資<div id="normalPay" class="num">$0</div></div><div class="box">加班費<div id="otPay" class="num">$0</div></div></div></div><div class="card"><div id="calendar"></div></div></div>
<div id="settings" class="page"><div class="card"><div class="section-title">設定</div><div class="setting"><span>時薪</span><input id="rate" type="number"></div><div class="setting"><span>每日正常薪資</span><input id="daily" type="number"></div><div class="setting"><span>上班時間</span><input id="workIn" type="time"></div><div class="setting"><span>午休開始</span><input id="lunch1" type="time"></div><div class="setting"><span>午休結束</span><input id="lunch2" type="time"></div><div class="setting"><span>正常下班</span><input id="workOut" type="time"></div><div class="setting"><span>加班開始計算</span><input id="otStart" type="time"></div><button id="saveSettings" class="punch" style="margin-top:18px;width:100%">儲存設定</button><div class="hint">目前預設：07:30 上班、12:00–13:00 午休、17:00 正常下班、18:30 開始計算加班。加班費＝時薪 × 2 × 加班分鐘 ÷ 60。</div></div></div>
<nav class="nav"><button data-page="home" class="active">⌂<br>打卡</button><button data-page="records">▤<br>紀錄</button><button data-page="month">▦<br>月統計</button><button data-page="settings">⚙<br>設定</button></nav>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeEdit()"><div class="sheet" onclick="event.stopPropagation()"><div class="modal-head"><span>修改打卡紀錄</span><button class="close" onclick="closeEdit()">×</button></div><div class="field"><label>日期</label><input id="eDate" type="date"></div><div class="field"><label>上班時間</label><input id="eIn" type="time"></div><div class="field"><label>下班時間</label><input id="eOut" type="time"></div><button class="punch save" onclick="saveEdit()">儲存修改</button><button class="edit danger" onclick="deleteEdit()">刪除這筆紀錄</button></div></div>
<script>
const RKEY='attendance_new_v1', SKEY='attendance_settings_new_v1';
let data=JSON.parse(localStorage.getItem(RKEY)||'[]');
let settings=Object.assign({rate:200,daily:1700,workIn:'07:30',lunch1:'12:00',lunch2:'13:00',workOut:'17:00',otStart:'18:30'},JSON.parse(localStorage.getItem(SKEY)||'{}'));
let editIndex=-1, selectedMonth='';
const $=id=>document.getElementById(id);
function saveData(){localStorage.setItem(RKEY,JSON.stringify(data))}
function pad(n){return String(n).padStart(2,'0')}
function dateKey(d=new Date()){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function money(n){return '$'+Number(n||0).toLocaleString('zh-TW',{maximumFractionDigits:2})}
function mins(t){if(!t)return 0;let [h,m]=t.split(':').map(Number);return h*60+m}
function overtime(r){if(!r.out)return 0;return Math.max(0,mins(r.out)-mins(settings.otStart))}
function otPay(r){return overtime(r)*settings.rate*2/60}
function fmt(d){return d.replaceAll('-','/')}
function today(){let k=dateKey();$('today').textContent=fmt(k)}
function renderClock(){let d=new Date();$('clock').textContent=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());today();renderHome()}
function getToday(){return data.find(r=>r.date===dateKey())}
function renderHome(){let r=getToday();$('status').textContent=!r?'今天尚未上班打卡':r.in&&!r.out?'已上班打卡，尚未下班':'今日已完成打卡';$('inBtn').disabled=!!(r&&r.in);$('outBtn').disabled=!(r&&r.in)||!!(r&&r.out);if(r){$('todayInfo').innerHTML=`上班 ${r.in||'—'}　下班 ${r.out||'—'}<br>加班 ${overtime(r)} 分鐘　加班費 ${money(otPay(r))}`}else $('todayInfo').textContent='尚無紀錄'}
$('inBtn').onclick=()=>{let k=dateKey(),r=getToday();if(!r){r={date:k,in:new Date().toTimeString().slice(0,5),out:''};data.push(r)}else r.in=new Date().toTimeString().slice(0,5);saveData();renderAll()}
$('outBtn').onclick=()=>{let r=getToday();if(r){r.out=new Date().toTimeString().slice(0,5);saveData();renderAll()}}
function renderRecords(){let rs=[...data].sort((a,b)=>b.date.localeCompare(a.date));if(!rs.length){$('recordList').innerHTML='<div class="empty">目前還沒有打卡紀錄</div>';return}$('recordList').innerHTML=rs.map(r=>{let idx=data.indexOf(r);return `<div class="record"><div class="record-head"><span>${fmt(r.date)}</span><span>${r.in&&r.out?'已完成':'未完成'}</span></div><div class="record-info">上班時間：${r.in||'—'}<br>下班時間：${r.out||'—'}<br>加班分鐘：${overtime(r)} 分鐘<br>加班費：${money(otPay(r))}<br>正常薪資：${r.in&&r.out?money(settings.daily):'$0'}</div><button class="edit" onclick="openEdit(${idx})">修改</button></div>`}).join('')}
function openEdit(idx){editIndex=idx;let r=data[idx];$('eDate').value=r.date;$('eIn').value=r.in||'';$('eOut').value=r.out||'';$('modal').classList.remove('hidden')}
function closeEdit(){$('modal').classList.add('hidden');editIndex=-1}
function saveEdit(){if(editIndex<0)return;let d=$('eDate').value;if(!d){alert('請選擇日期');return}let r=data[editIndex];r.date=d;r.in=$('eIn').value;r.out=$('eOut').value;data=data.filter((x,i)=>i===editIndex||x.date!==d);saveData();closeEdit();renderAll()}
function deleteEdit(){if(editIndex<0)return;if(confirm('確定刪除這筆紀錄？')){data.splice(editIndex,1);saveData();closeEdit();renderAll()}}
function monthVal(){return $('monthPick').value||new Date().toISOString().slice(0,7)}
function renderMonth(){let m=monthVal();let rs=data.filter(r=>r.date.startsWith(m));$('days').textContent=rs.filter(r=>r.in&&r.out).length+' 天';$('otMin').textContent=rs.reduce((s,r)=>s+overtime(r),0)+' 分';$('normalPay').textContent=money(rs.filter(r=>r.in&&r.out).length*settings.daily);$('otPay').textContent=money(rs.reduce((s,r)=>s+otPay(r),0));let [y,mo]=m.split('-').map(Number),first=new Date(y,mo-1,1),last=new Date(y,mo,0),start=first.getDay();let html='<div class="grid">'+['日','一','二','三','四','五','六'].map(x=>`<div class="dow">${x}</div>`).join('');for(let i=0;i<start;i++)html+='<div></div>';for(let d=1;d<=last.getDate();d++){let k=y+'-'+pad(mo)+'-'+pad(d),r=data.find(x=>x.date===k);html+=`<button class="day ${r?'has ':''}${k===dateKey()?'today':''}" onclick="openDate('${k}')"><b>${d}</b>${r?`<small>${r.in||'—'}<br>${r.out||'—'}</small>`:''}</button>`}html+='</div>';$('calendar').innerHTML=html}
function openDate(k){let idx=data.findIndex(r=>r.date===k);if(idx<0){data.push({date:k,in:'',out:''});idx=data.length-1;saveData()}openEdit(idx)}
$('prev').onclick=()=>{let [y,m]=monthVal().split('-').map(Number);m--;if(m<1){m=12;y--}$('monthPick').value=y+'-'+pad(m);renderMonth()};$('next').onclick=()=>{let [y,m]=monthVal().split('-').map(Number);m++;if(m>12){m=1;y++}$('monthPick').value=y+'-'+pad(m);renderMonth()};$('monthPick').onchange=renderMonth;
function renderSettings(){$('rate').value=settings.rate;$('daily').value=settings.daily;$('workIn').value=settings.workIn;$('lunch1').value=settings.lunch1;$('lunch2').value=settings.lunch2;$('workOut').value=settings.workOut;$('otStart').value=settings.otStart}
$('saveSettings').onclick=()=>{settings={rate:+$('rate').value||200,daily:+$('daily').value||1700,workIn:$('workIn').value||'07:30',lunch1:$('lunch1').value||'12:00',lunch2:$('lunch2').value||'13:00',workOut:$('workOut').value||'17:00',otStart:$('otStart').value||'18:30'};localStorage.setItem(SKEY,JSON.stringify(settings));renderAll();alert('設定已儲存')}
function showPage(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(p).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===p));if(p==='records')renderRecords();if(p==='month')renderMonth();if(p==='settings')renderSettings()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>showPage(b.dataset.page));
function renderAll(){renderHome();renderRecords();renderMonth();renderSettings()}
$('monthPick').value=new Date().toISOString().slice(0,7);renderAll();setInterval(renderClock,1000);renderClock();
if ('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body></html>
